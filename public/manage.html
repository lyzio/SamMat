<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SamMat</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="SamMat" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#1e272e" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/common.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="topbar no-print">
      <div class="brand"><a href="/" class="logo">SamMat</a><span class="logo-sub">admin</span></div>
      <div class="row" style="flex:0 0 auto">
        <a href="#" id="orderLink" data-sv="Beställningssidan" data-en="Order page">Beställningssidan</a>
        <button id="logout" class="secondary small" hidden data-sv="Logga ut" data-en="Log out">Logga ut</button>
      </div>
    </div>
    <div id="content"></div>
  </div>

  <script>
    const slug = location.pathname.split('/')[2];
    document.getElementById('orderLink').href = `/r/${slug}`;
    const el = document.getElementById('content');
    const base = `/api/rounds/${slug}`;
    let data = null;
    let timer = null;

    const amount = (o) => (o.final_price ?? o.total_price);
    const active = () => data.orders.filter((o) => !o.cancelled_at);
    const orderText = (o) => [o.item_name, o.addons_text, o.removals_text].filter(Boolean).join(' - ');
    const orderLine = (o) => `#${o.order_number} (${o.customer_name}) ${orderText(o)}`;
    const groupLines = (orders) => {
      const g = new Map();
      for (const o of orders) {
        const t = orderText(o);
        const x = g.get(t) || { n: 0, t, nrs: [] };
        x.n += 1; x.nrs.push('#' + o.order_number);
        g.set(t, x);
      }
      return [...g.values()].sort((a, b) => a.t.localeCompare(b.t, 'sv')).map((x) => `${x.n}× ${x.t} (${x.nrs.join(', ')})`);
    };
    // Drinks are picked up by everyone themselves, so they go at the bottom of the list, summed
    const drinkLines = (orders) => {
      const m = new Map();
      for (const o of orders) for (const x of o.extras || []) {
        const g = m.get(x.name) || { n: 0, who: [] };
        g.n += x.qty; g.who.push(`#${o.order_number}${x.qty > 1 ? '×' + x.qty : ''}`);
        m.set(x.name, g);
      }
      return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], 'sv')).map(([name, g]) => `${g.n}× ${name} (${g.who.join(', ')})`);
    };
    const DRINK_HEAD = L('Dricka (hämtas själv)', 'Drinks (pick up yourself)');
    const listText = (orders) => {
      const d = drinkLines(orders);
      return [...orders.map(orderLine), ...(d.length ? ['', DRINK_HEAD + ':', ...d] : [])].join('\n');
    };

    async function fetchData() {
      try {
        data = await api(`${base}/manage`);
        return true;
      } catch (e) {
        clearInterval(timer);
        document.getElementById('logout').hidden = true;
        if (e.status === 401) {
          pinLogin(el, { title: L('Hantera sambeställning', 'Manage group order'), hint: L('Ange PIN-koden du fick när rundan startades.', 'Enter the PIN code you got when the round was started.'), url: `${base}/login`, onOk: init });
        } else {
          el.innerHTML = `<div class="card"><h1>${L('Hittades inte', 'Not found')}</h1><p class="muted">${esc(e.message)}</p><a class="cta" href="/">${L('Till startsidan', 'To the start page')}</a></div>`;
        }
        return false;
      }
    }

    async function init() {
      if (!(await fetchData())) return;
      document.getElementById('logout').hidden = false;
      el.innerHTML = `
        <div id="head"></div>
        <div id="orders"></div>
        <div id="mail"></div>
        <div id="settings"></div>`;
      renderAll();
      clearInterval(timer);
      timer = setInterval(refresh, 5000);
    }

    function renderAll() {
      document.title = `SamMat – ${data.round.title}`;
      renderHead(); renderOrders(); renderMail(); renderSettings();
    }

    async function refresh(force) {
      if (!(await fetchData())) return;
      renderHead();
      const box = document.getElementById('orders');
      const typing = box.contains(document.activeElement) && document.activeElement.matches('input');
      if (force === true || !typing) renderOrders();
      updateCounts();
    }

    // ---------- Head: status, link, PIN, open/close, end ----------
    function renderHead() {
      const r = data.round;
      document.getElementById('head').innerHTML = `
        <div class="card no-print">
          <div class="row" style="justify-content:space-between;align-items:center">
            <h1 style="margin:0;flex:1">${esc(r.title)}</h1>
            <span class="badge ${r.isOpen ? 'open' : 'closed'}" style="flex:0 0 auto">${r.isOpen ? L('Öppen', 'Open') : L('Stängd', 'Closed')}</span>
          </div>
          <div class="info">
            ${r.name ? `<span>${esc(r.placeName)}</span>` : ''}
            ${r.locationName ? `<span>📍 ${esc(r.locationName)}</span>` : ''}
            ${r.companyName ? `<span>🏢 ${esc(r.companyName)}</span>` : ''}
            <span>${L('av', 'by')} ${esc(r.creatorName)}</span>
            <span>Swish <strong>${esc(r.swishNumber)}</strong> ${r.payMode === 'before' ? L('(betalas direkt)', '(paid when ordering)') : L('(betalas efter)', '(paid afterwards)')}</span>
            <span>${L('För', 'For')} <strong>${esc(dayWord(r.eventDate))}</strong></span>
            ${r.isOpen && r.closeAt ? `<span>${L('Stänger', 'Closes')} <strong>${esc(whenShort(r.closeAt))}</strong> (${until(r.closeAt)})</span>` : ''}
            ${r.foodEta ? `<span>${L('Mat ca', 'Food approx.')} <strong>${esc(r.foodEta)}</strong></span>` : ''}
          </div>
          ${placeInfo(r.place)}
          ${r.reminderAt || r.reminderSentAt ? `<div class="info">
            <span>🔔 ${L(`Påminnelse${r.confirm ? ' med bekräfta/avboka' : ''}`, `Reminder${r.confirm ? ' with confirm/cancel' : ''}`)}: ${r.reminderSentAt ? `${L('skickad', 'sent')} <strong>${esc(whenShort(r.reminderSentAt))}</strong>` : `${L('skickas', 'goes out')} <strong>${esc(whenShort(r.reminderAt))}</strong>`}</span>
            ${confirmStats()}
          </div>` : ''}
          <label>${L('Länk att dela', 'Link to share')}</label>
          <div class="linkbox"><code>${esc(r.link)}</code><button class="secondary small" data-copy-link>${L('Kopiera', 'Copy')}</button></div>
          <p class="muted" style="margin:10px 0 0">${L('PIN-kod för att hantera', 'PIN code to manage')}: <strong class="pin-inline">${esc(r.pin)}</strong></p>
          <div class="row" style="margin-top:16px">
            <button class="secondary" data-toggle style="flex:0 0 auto">${r.isOpen ? L('Stäng beställningar', 'Close ordering') : L('Öppna igen', 'Reopen')}</button>
            <button class="danger" data-end style="flex:0 0 auto">${L('Avsluta runda &amp; radera', 'End round &amp; delete')}</button>
          </div>
        </div>`;
    }

    function confirmStats() {
      const all = data.orders;
      const yes = all.filter((o) => o.confirmed_at && !o.cancelled_at).length;
      const no = all.filter((o) => o.cancelled_at).length;
      const wait = all.length - yes - no;
      if (!data.round.confirm && !no) return '';
      return `<span>✓ ${yes} ${L('bekräftat', 'confirmed')} · ${wait} ${L('väntar', 'waiting')} · ✕ ${no} ${L('avbokat', 'cancelled')}</span>`;
    }

    // Where to order: phone, address, menu link, note (set by the admin per place)
    function placeInfo(p) {
      if (!p) return '';
      const bits = [p.phone && `☎ <a href="tel:${esc(p.phone.replace(/\s/g, ''))}">${esc(p.phone)}</a>`, p.address && `📍 ${esc(p.address)}`,
        p.url && `<a href="${esc(p.url)}" target="_blank" rel="noopener">${L('Meny', 'Menu')} ↗</a>`, p.note && esc(p.note)].filter(Boolean);
      return bits.length ? `<div class="info">${bits.map((b) => `<span>${b}</span>`).join('')}</div>` : '';
    }

    // ---------- Orders + payment ----------
    function renderOrders() {
      const orders = active();
      const cancelled = data.orders.filter((o) => o.cancelled_at);
      const r = data.round;
      const showStatus = r.confirm || cancelled.length > 0;
      const showShare = r.sharedCost > 0;
      const status = (o) => o.cancelled_at ? `<span class="st no">${L('Avbokad', 'Cancelled')}</span>`
        : o.confirmed_at ? `<span class="st yes">✓ ${L('Bekräftad', 'Confirmed')}</span>`
        : r.reminderSentAt && r.confirm ? `<span class="st wait">${L('Väntar', 'Waiting')}</span>` : '';
      const box = document.getElementById('orders');
      if (!data.orders.length) {
        box.innerHTML = `<div class="card"><h2>${L('Orderlista', 'Order list')}</h2><p class="muted">${L('Inga beställningar ännu. Dela länken!', 'No orders yet. Share the link!')}</p></div>`;
        return;
      }
      const owed = orders.reduce((s, o) => s + o.owed, 0);
      const paidSum = orders.reduce((s, o) => s + Math.min(o.paid, o.owed), 0);
      const t = (iso) => (iso ? hm(iso) : '');
      const mailed = (o) => [o.reminder_mail_at ? `🔔 ${t(o.reminder_mail_at)}` : '', o.food_mail_at ? `🍽️ ${t(o.food_mail_at)}` : '',
        o.pay_mail_at ? `💸 ${t(o.pay_mail_at)}` : '', o.pay_remind_at ? `⏰ ${t(o.pay_remind_at)}` : ''].filter(Boolean).join('<br>');
      const paidCell = (o) => {
        const part = o.paid > 0 && !o.isPaid;
        return `<input type="checkbox" data-paid="${o.order_number}" ${o.isPaid ? 'checked' : ''} />
          ${part ? `<div class="st wait" title="${L('Betalt', 'Paid')} ${o.paid} kr">${L('kvar', 'left')} ${o.outstanding} kr</div>` : ''}`;
      };
      const row = (o) => o.cancelled_at ? `
        <tr class="cancelled">
          <td class="nr">#${o.order_number}</td>
          <td>${esc(o.customer_name)}<div class="muted" style="font-size:.8rem">${esc(o.email)}</div></td>
          <td>${esc(o.item_name)}</td>
          <td class="r muted">${o.total_price} kr</td>
          <td></td>${showShare ? '<td></td>' : ''}<td></td><td></td>
          ${showStatus ? `<td>${status(o)}</td>` : ''}
          <td class="r"><button class="secondary small" data-restore="${o.order_number}" title="${L('Ångra avbokning', 'Undo cancellation')}">↺</button></td>
          <td class="r"><button class="danger small" data-del="${o.order_number}">✕</button></td>
        </tr>` : `
        <tr class="${o.isPaid ? 'paid' : ''}">
          <td class="nr">#${o.order_number}</td>
          <td>${esc(o.customer_name)}<div class="muted" style="font-size:.8rem">${esc(o.email)}</div></td>
          <td>${esc(o.item_name)}${o.extras_text ? `<div class="muted" style="font-size:.8rem">+ ${esc(o.extras_text)}</div>` : ''}${o.updated_at ? `<div class="muted" style="font-size:.75rem">✎ ${L('ändrad', 'changed')} ${hm(o.updated_at)}</div>` : ''}</td>
          <td class="r muted">${o.total_price} kr</td>
          <td class="r"><input type="number" min="0" class="price-in ${o.final_price != null && o.final_price !== o.total_price ? 'changed' : ''}"
               data-price="${o.order_number}" value="${o.final_price ?? ''}" placeholder="${o.total_price}" /></td>
          ${showShare ? `<td class="r muted">+${o.share} kr</td>` : ''}
          <td class="r"><strong>${o.owed} kr</strong></td>
          <td class="center">${paidCell(o)}</td>
          ${showStatus ? `<td>${status(o)}</td>` : ''}
          <td class="muted" style="font-size:.8rem;white-space:nowrap">${mailed(o)}</td>
          <td class="r"><button class="danger small" data-del="${o.order_number}">✕</button></td>
        </tr>`;

      box.innerHTML = `
        <div class="card">
          <div class="row" style="justify-content:space-between;align-items:center">
            <h2 style="margin:0;flex:1">${L('Orderlista', 'Order list')} – ${esc(r.title)} <span class="muted">(${orders.length}${cancelled.length ? `, ${cancelled.length} ${L('avbokade', 'cancelled')}` : ''})</span></h2>
            <button class="secondary small no-print" data-copy="list" style="flex:0 0 auto">${L('Kopiera', 'Copy')}</button>
            <button class="secondary small no-print" onclick="window.print()" style="flex:0 0 auto">${L('Skriv ut', 'Print')}</button>
          </div>
          <div class="orderlist">${orders.map((o) => `<div>${esc(orderLine(o))}</div>`).join('')}</div>
          ${drinkLines(orders).length ? `<h3 class="drink-head">${DRINK_HEAD}</h3>
          <div class="orderlist">${drinkLines(orders).map((l) => `<div>${esc(l)}</div>`).join('')}</div>` : ''}
          <details class="no-print" style="margin-top:14px">
            <summary class="muted">${L('Sammanställt per rätt', 'Summary per dish')}</summary>
            <div class="orderlist">${groupLines(orders).map((l) => `<div>${esc(l)}</div>`).join('')}</div>
            <button class="secondary small" data-copy="groups" style="margin-top:8px">${L('Kopiera sammanställning', 'Copy summary')}</button>
          </details>
        </div>
        <div class="card no-print">
          <h2>${L('Betalning', 'Payment')}</h2>
          <p class="muted">${L('Att få in', 'To collect')}: <strong>${owed} kr</strong> · ${L('Swishat', 'Paid')}: <strong>${paidSum} kr</strong> · ${L('Kvar', 'Left')}: <strong>${owed - paidSum} kr</strong></p>
          <form id="sharedForm" class="row" style="margin:6px 0 4px">
            <div><label for="shLabel">${L('Gemensam kostnad', 'Shared cost')}</label><input id="shLabel" type="text" maxlength="40" placeholder="${L('T.ex. Utkörning', 'E.g. Delivery')}" value="${esc(r.sharedLabel)}" /></div>
            <div style="max-width:140px;min-width:110px"><label for="shCost">${L('Belopp kr', 'Amount kr')}</label><input id="shCost" type="number" min="0" value="${r.sharedCost || ''}" placeholder="0" /></div>
            <button type="submit" class="secondary">${L('Fördela', 'Split')}</button>
          </form>
          <p class="muted" style="font-size:.82rem;margin:4px 0 0">
            ${r.sharedCost && orders.length ? (() => { const lo = Math.floor(r.sharedCost / orders.length), hi = Math.ceil(r.sharedCost / orders.length); return L(`${r.sharedCost} kr delas lika på ${orders.length} – ${lo === hi ? lo : lo + '–' + hi} kr var. `, `${r.sharedCost} kr split between ${orders.length} – ${lo === hi ? lo : lo + '–' + hi} kr each. `); })() : L('Delas lika på alla som inte avbokat. ', 'Split equally between everyone who has not cancelled. ')}
            ${r.payMode === 'before'
              ? L('Alla fick Swish direkt med menypriset. Kryssa "Swishat" när de betalt – ändras priset eller tillkommer en gemensam kostnad efteråt, får de ett betalningsmejl med bara mellanskillnaden.', 'Everyone got Swish right away with the menu price. Tick "Paid" when they have paid – if the price changes or a shared cost is added later, the payment mail asks only for the difference.')
              : L('Skriv in det riktiga priset från kvittot i <em>Mat</em> (tomt = menypris). Det används i betalningsmejlet.', 'Enter the real price from the receipt under <em>Food</em> (empty = menu price). It is used in the payment mail.')}</p>
          <div class="table-scroll"><table>
            <thead><tr><th>Nr</th><th>${L('Namn', 'Name')}</th><th>${L('Beställning', 'Order')}</th><th class="r">${L('Meny', 'Menu')}</th><th class="r">${L('Mat', 'Food')}</th>${showShare ? `<th class="r">${esc(r.sharedLabel || L('Andel', 'Share'))}</th>` : ''}<th class="r">${L('Totalt', 'Total')}</th><th>${L('Swishat', 'Paid')}</th>${showStatus ? '<th>Status</th>' : ''}<th>${L('Mejlat', 'Mailed')}</th><th></th></tr></thead>
            <tbody>${[...orders, ...cancelled].map(row).join('')}</tbody>
          </table></div>
        </div>`;
      document.getElementById('sharedForm').onsubmit = act(async (e) => {
        e.preventDefault();
        await api(base, 'PATCH', { sharedLabel: document.getElementById('shLabel').value.trim(), sharedCost: Number(document.getElementById('shCost').value || 0) });
        await refresh(true);
      });
    }

    // ---------- Mail ----------
    function updateCounts() {
      const f = document.getElementById('cntFood'); const p = document.getElementById('cntPay');
      const r = document.getElementById('cntRem');
      if (f) f.textContent = active().length;
      if (p) p.textContent = active().filter((o) => o.outstanding > 0).length;
      if (r) r.textContent = active().length;
    }

    function renderMail() {
      const box = document.getElementById('mail');
      if (!data.mailConfigured) {
        box.innerHTML = `<div class="card no-print"><h2>${L('Mejl', 'Mail')}</h2><p class="muted">${L('Mejl är inte konfigurerat på servern.', 'Mail is not configured on the server.')}</p></div>`;
        return;
      }
      box.innerHTML = `
        <div class="card no-print">
          <h2>${L('Mejl', 'Mail')}</h2>
          <p class="muted" style="margin-top:0">${L('Skickas bara när du trycker. Valfri ordning, och går att skicka igen. Varje mottagare får mejlet på sitt språk.', 'Only sent when you press. Any order, and can be sent again. Each recipient gets the mail in their language.')}</p>
          <label for="mailExtra">${L('Extra rad i mejlet (valfritt)', 'Extra line in the mail (optional)')}</label>
          <textarea id="mailExtra" rows="2" maxlength="500" placeholder="${L('T.ex. Maten står i köket på plan 3', 'E.g. The food is in the kitchen on the 3rd floor')}"></textarea>
          <div class="row" style="margin-top:12px">
            <button data-mail="food" style="flex:0 0 auto">🍽️ ${L('Maten är här', 'The food is here')} (<span id="cntFood">0</span>)</button>
            <button data-mail="pay" class="go" style="flex:0 0 auto">💸 ${L('Skicka betalningsmejl', 'Send payment mails')} (<span id="cntPay">0</span> ${L('med belopp kvar', 'with an amount left')})</button>
            <button data-mail="reminder" class="secondary" style="flex:0 0 auto">🔔 ${L('Skicka påminnelse nu', 'Send reminder now')} (<span id="cntRem">0</span>)</button>
            <button data-mail="orders" class="secondary" style="flex:0 0 auto">📋 ${L('Mejla orderlistan till mig', 'Mail me the order list')}</button>
          </div>
        </div>`;
      updateCounts();
    }

    async function sendMail(kind, btn) {
      if (kind === 'orders') {
        const r = await api(`${base}/mail/orders`, 'POST', {});
        alert(L(`Orderlistan skickad till ${r.to}.`, `Order list sent to ${r.to}.`));
        return;
      }
      if (kind === 'reminder') {
        const n = active().length;
        if (!n) return alert(L('Ingen att skicka till.', 'Nobody to send to.'));
        if (!confirm(L(`Skicka påminnelse${data.round.confirm ? ' (med bekräfta/avboka)' : ''} till ${n} person(er) nu?`, `Send the reminder${data.round.confirm ? ' (with confirm/cancel)' : ''} to ${n} person(s) now?`) +
          (data.round.reminderSentAt ? L('\nDen är redan skickad en gång.', '\nIt has already been sent once.') : '') + (data.round.reminderAt && !data.round.reminderSentAt ? L('\nDen schemalagda påminnelsen skickas då inte igen.', '\nThe scheduled reminder will then not be sent again.') : ''))) return;
        btn.disabled = true;
        try {
          const r = await api(`${base}/mail/reminder`, 'POST', {});
          alert(`${L('Skickat', 'Sent')}: ${r.sent}` + (r.failed.length ? `\n${L('Misslyckades', 'Failed')}:\n${r.failed.join('\n')}` : ''));
        } finally { btn.disabled = false; await refresh(); }
        return;
      }
      const extra = document.getElementById('mailExtra').value.trim();
      const list = kind === 'food' ? active() : active().filter((o) => o.outstanding > 0);
      if (!list.length) return alert(L('Ingen att skicka till.', 'Nobody to send to.'));
      const already = list.filter((o) => (kind === 'food' ? o.food_mail_at : o.pay_mail_at)).length;
      let msg = L(`Skicka ${kind === 'food' ? '"Maten är här"' : 'betalningsmejl'} till ${list.length} person(er)?`, `Send ${kind === 'food' ? '"The food is here"' : 'payment mails'} to ${list.length} person(s)?`);
      if (already) msg += L(`\n${already} har redan fått det och får det igen.`, `\n${already} already got it and will get it again.`);
      if (kind === 'pay') {
        const noFinal = list.filter((o) => o.final_price == null).length;
        if (noFinal) msg += L(`\n${noFinal} har inget kvittopris – menypriset används.`, `\n${noFinal} have no receipt price – the menu price is used.`);
      }
      if (!confirm(msg)) return;
      btn.disabled = true;
      try {
        const r = await api(`${base}/mail/${kind}`, 'POST', { extra });
        alert(`${L('Skickat', 'Sent')}: ${r.sent}` + (r.skipped ? `\n${L('Utan e-post', 'Without e-mail')}: ${r.skipped}` : '') + (r.failed.length ? `\n${L('Misslyckades', 'Failed')}:\n${r.failed.join('\n')}` : ''));
      } finally {
        btn.disabled = false;
        await refresh();
      }
    }

    // ---------- Settings ----------
    function renderSettings() {
      const r = data.round;
      document.getElementById('settings').innerHTML = `
        <div class="card no-print">
          <details>
            <summary><h2 style="display:inline">${L('Inställningar', 'Settings')}</h2></summary>
            <form id="setForm">
              <div class="grid-form">
                <div><label for="sName">${L('Namn på rundan', 'Name of the round')}</label><input id="sName" type="text" maxlength="50" value="${esc(r.name)}" placeholder="${esc(r.placeName)}" /></div>
                <div><label for="sSwish">${L('Swish-nummer', 'Swish number')}</label><input id="sSwish" type="tel" required value="${esc(r.swishNumber)}" /></div>
                <div><label for="sDate">${L('Datum för maten', 'Date of the food')}</label><input id="sDate" type="date" value="${esc(r.eventDate)}" /></div>
                <div><label for="sEta">${L('Maten kommer ca kl.', 'Food arrives approx.')}</label><input id="sEta" type="time" value="${esc(r.foodEta)}" /></div>
                <div><label for="sClose">${L('Stäng beställningar', 'Close ordering')}</label><input id="sClose" type="datetime-local" value="${esc(r.isOpen ? isoToLocal(r.closeAt) : '')}" /></div>
                ${data.mailConfigured ? `<div><label for="sRemind">${L('Påminnelse', 'Reminder')}</label><input id="sRemind" type="datetime-local" value="${esc(r.reminderSentAt ? '' : isoToLocal(r.reminderAt))}" /></div>` : ''}
              </div>
              ${data.mailConfigured ? `<label for="sPayRemind">${L('Påminn obetalda automatiskt', 'Remind unpaid automatically')}</label>
              <select id="sPayRemind">
                ${[[0, L('Nej', 'No')], [2, L('2 timmar efter betalningsmejlet', '2 hours after the payment mail')], [4, L('4 timmar efter', '4 hours after')], [24, L('Dagen efter (24 h)', 'The day after (24 h)')], [48, L('Två dagar efter (48 h)', 'Two days after (48 h)')]]
                  .map(([v, l]) => `<option value="${v}" ${r.payRemindHours === v ? 'selected' : ''}>${l}</option>`).join('')}
              </select>` : ''}
              ${COMPANIES.length ? `<label for="sComp">${L('För företag', 'For company')}</label>
              <select id="sComp"><option value="">${L('Alla i huset', 'Everyone in the building')}</option>
                ${COMPANIES.map((c) => `<option value="${c.id}" ${c.id === r.companyId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>` : ''}
              <label for="sPay">${L('Betalning', 'Payment')}</label>
              <select id="sPay">
                <option value="after" ${r.payMode === 'after' ? 'selected' : ''}>${L('Efter maten – betalningsmejl', 'After the food – payment mail')}</option>
                <option value="before" ${r.payMode === 'before' ? 'selected' : ''}>${L('Direkt vid beställning', 'When ordering')}</option>
              </select>
              ${data.mailConfigured ? `<label class="check"><input type="checkbox" id="sConfirm" ${r.confirm ? 'checked' : ''} />
                <span>${L('Be alla bekräfta eller avboka i påminnelsen', 'Ask everyone to confirm or cancel in the reminder')}</span></label>
                ${r.reminderSentAt ? `<p class="muted" style="font-size:.82rem;margin:4px 0 0">${L(`Påminnelsen skickades ${esc(whenShort(r.reminderSentAt))}. Sätt en ny tid för att skicka igen.`, `The reminder was sent ${esc(whenShort(r.reminderSentAt))}. Set a new time to send it again.`)}</p>` : ''}` : ''}
              <label for="sEmail">${L('Din e-post', 'Your e-mail')}</label>
              <input id="sEmail" type="email" maxlength="120" value="${esc(r.creatorEmail)}" />
              ${data.mailConfigured ? `<label class="check"><input type="checkbox" id="sMail" ${r.mailOrders ? 'checked' : ''} />
                <span>${L('Mejla orderlistan till mig när beställningen stängs', 'Mail me the order list when ordering closes')}${r.ordersMailedAt ? ` <span class="muted">(${L('skickad', 'sent')} ${hm(r.ordersMailedAt)})</span>` : ''}</span></label>` : ''}
              <p class="muted" style="font-size:.82rem">${L('Swish-numret gäller betalningssidan och nya betalningsmejl direkt. Beställningarna ligger kvar.', 'The Swish number applies to the payment page and new payment mails right away. The orders stay.')}</p>
              <div id="setErr"></div>
              <button type="submit" style="margin-top:8px">${L('Spara', 'Save')}</button>
            </form>
          </details>
        </div>`;
      document.getElementById('setForm').onsubmit = act(async (e) => {
        e.preventDefault();
        const $ = (id) => document.getElementById(id);
        const body = {
          name: $('sName').value.trim(),
          swishNumber: $('sSwish').value.trim(),
          eventDate: $('sDate').value,
          payMode: $('sPay').value,
          ...($('sComp') ? { companyId: $('sComp').value ? Number($('sComp').value) : null } : {}),
          ...($('sPayRemind') ? { payRemindHours: Number($('sPayRemind').value) } : {}),
          closeAt: $('sClose').value ? new Date($('sClose').value).toISOString() : null,
          foodEta: $('sEta').value,
          creatorEmail: $('sEmail').value.trim()
        };
        if ($('sMail')) body.mailOrders = $('sMail').checked;
        if ($('sRemind')) {
          const v = $('sRemind').value;
          if (v || !data.round.reminderSentAt) body.reminderAt = v ? new Date(v).toISOString() : null;
          body.confirm = $('sConfirm').checked;
        }
        try {
          await api(base, 'PATCH', body);
        } catch (ex) {
          $('setErr').innerHTML = `<div class="error">${esc(ex.message)}</div>`;
          return;
        }
        await fetchData();
        renderAll();
      });
    }

    // ---------- Delegated events ----------
    el.addEventListener('click', act(async (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      if (t.dataset.copyLink !== undefined) return copyText(data.round.link, t);
      if (t.dataset.copy) return copyText(t.dataset.copy === 'groups' ? groupLines(active()).join('\n') : listText(active()), t);
      if (t.dataset.restore) {
        await api(`${base}/orders/${t.dataset.restore}/restore`, 'PATCH', {});
        return refresh();
      }
      if (t.dataset.toggle !== undefined) {
        await api(base, 'PATCH', { isOpen: !data.round.isOpen });
        return refresh();
      }
      if (t.dataset.end !== undefined) {
        const unpaid = active().filter((o) => o.outstanding > 0).length;
        if (!confirm(L(`Avsluta rundan?\n\nAlla ${data.orders.length} beställningar raderas permanent, med namn och e-postadresser. Betalningslänkarna slutar fungera.`, `End the round?\n\nAll ${data.orders.length} orders are deleted permanently, with names and e-mail addresses. The payment links stop working.`) + (unpaid ? L(`\n\nOBS: ${unpaid} är inte markerade som swishade.`, `\n\nNote: ${unpaid} are not marked as paid.`) : ''))) return;
        await api(`${base}/end`, 'POST', {});
        clearInterval(timer);
        el.innerHTML = `<div class="card"><h1>${L('Rundan är avslutad', 'The round has ended')}</h1><p class="muted">${L('Allt är raderat. Tack för att du höll i den!', 'Everything is deleted. Thanks for running it!')}</p><a class="cta" href="/">${L('Till startsidan', 'To the start page')}</a></div>`;
        return;
      }
      if (t.dataset.del) {
        const o = data.orders.find((x) => x.order_number === Number(t.dataset.del));
        if (!confirm(L(`Ta bort #${o.order_number} ${o.customer_name}? Numret återanvänds inte.`, `Delete #${o.order_number} ${o.customer_name}? The number is not reused.`))) return;
        await api(`${base}/orders/${o.order_number}`, 'DELETE');
        return refresh();
      }
      if (t.dataset.mail) return sendMail(t.dataset.mail, t);
    }));

    el.addEventListener('change', act(async (e) => {
      const t = e.target;
      if (t.dataset.price) {
        await api(`${base}/orders/${t.dataset.price}/price`, 'PATCH', { price: t.value === '' ? null : Number(t.value) });
        t.blur();
        await refresh(true);
      } else if (t.dataset.paid) {
        await api(`${base}/orders/${t.dataset.paid}/paid`, 'PATCH', { paid: t.checked });
        await refresh(true);
      }
    }));

    document.getElementById('logout').onclick = async () => {
      await fetch('/api/logout', { method: 'POST' });
      location.reload();
    };

    let COMPANIES = [];
    api('/api/rounds').then((d) => { COMPANIES = d.companies || []; }).catch(() => {}).finally(init);
  </script>
</body>
</html>

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SamMat</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="SamMat" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#1e272e" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/common.js"></script>
</head>
<body>
  <div class="wrap narrow">
    <div class="topbar"><a href="/" class="logo">SamMat</a></div>
    <div id="locPick"></div>
    <div id="app"><div class="card"><p class="muted">…</p></div></div>
    <div id="install"></div>
    <div class="foot"><a href="/integritet" data-sv="Integritet" data-en="Privacy">Integritet</a> · <a href="/admin">Admin</a></div>
  </div>

  <script>
    const appEl = document.getElementById('app');

    async function load(first) {
      let data;
      try { data = await api('/api/rounds'); } catch (e) {
        appEl.innerHTML = `<div class="card"><h1>${L('Kunde inte ladda', 'Could not load')}</h1><p class="muted">${esc(e.message)}</p></div>`;
        return;
      }
      // Location filter (only when locations exist). Rounds at places without a location show everywhere.
      const locs = data.locations || [];
      const comps = data.companies || [];
      let sel = store.get('sammat_location');
      if (sel && !locs.some((l) => String(l.id) === sel)) sel = '';
      let selC = store.get('sammat_company');
      if (selC && !comps.some((c) => String(c.id) === selC)) selC = '';
      renderFilters(locs, sel, comps, selC);
      // Rounds without location/company are for everyone, so they always show
      const rounds = data.rounds.filter((r) => (!sel || !r.locationId || String(r.locationId) === sel)
        && (!selC || !r.companyId || String(r.companyId) === selC));
      const selName = [sel ? locs.find((l) => String(l.id) === sel).name : '', selC ? comps.find((c) => String(c.id) === selC).name : ''].filter(Boolean).join(' · ');
      // Exactly one round that is open: go straight to it
      if (first && rounds.length === 1 && rounds[0].isOpen) {
        location.replace('/r/' + rounds[0].slug);
        return;
      }
      const item = (r) => `
        <a class="round-item ${r.isOpen ? '' : 'closed'}" href="/r/${esc(r.slug)}">
          <h2>${esc(r.title)}${r.isToday ? '' : ` <span class="date-tag">${esc(dayWord(r.eventDate))}</span>`}</h2>
          <div class="info">
            ${r.name ? `<span>${esc(r.placeName)}</span>` : ''}
            ${locs.length && r.locationName && !sel ? `<span>📍 ${esc(r.locationName)}</span>` : ''}
            ${comps.length && r.companyName && !selC ? `<span>🏢 ${esc(r.companyName)}</span>` : ''}
            <span>${L('av', 'by')} ${esc(r.creatorName)}</span>
            <span>${r.orderCount} ${L('beställda', 'ordered')}</span>
          </div>
          <div class="info">
            ${r.isOpen
              ? (r.closeAt ? `<span>${L('Beställ senast', 'Order by')} <strong>${esc(whenShort(r.closeAt))}</strong> (${until(r.closeAt)})</span>` : `<span class="badge open">${L('Öppen', 'Open')}</span>`)
              : `<span class="badge closed">${L('Stängd', 'Closed')}</span>`}
            ${r.foodEta ? `<span>${L('Mat ca', 'Food approx.')} <strong>${esc(r.foodEta)}</strong></span>` : ''}
          </div>
        </a>`;

      appEl.innerHTML = rounds.length
        ? `<h1 style="margin-bottom:14px">${rounds.length > 1 ? L('Pågående sambeställningar', 'Ongoing group orders') : L('Pågående sambeställning', 'Ongoing group order')}</h1>${selName ? `<p class="muted" style="margin:-8px 0 14px">${esc(selName)}</p>` : ''}
           <div class="round-list">${rounds.map(item).join('')}</div>
           <a class="cta" href="/ny">+ ${L('Starta en egen sambeställning', 'Start your own group order')}</a>`
        : `<div class="card">
             <h1>${L('Ingen sambeställning just nu', 'No group order right now')}</h1>${selName ? `<p class="muted" style="margin-top:-2px">${esc(selName)}</p>` : ''}
             <p class="muted">${L('Sugen? Starta en – du får en länk att dela och en PIN-kod för att hantera den.', 'Hungry? Start one – you get a link to share and a PIN code to manage it.')}</p>
             <a class="cta" href="/ny">+ ${L('Starta en sambeställning', 'Start a group order')}</a>
           </div>`;
    }

    // Location and company pickers (each only when the admin has added any)
    function renderFilters(locs, sel, comps, selC) {
      const el = document.getElementById('locPick');
      if (!locs.length && !comps.length) { el.innerHTML = ''; return; }
      if (el.querySelector('select')) return; // keep the user's open dropdown during refresh
      const pick = (id, icon, label, all, list, cur) => list.length ? `<label class="loc-pick">${icon} <select id="${id}" aria-label="${label}">
        <option value="">${all}</option>
        ${list.map((x) => `<option value="${x.id}" ${String(x.id) === cur ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
      </select></label>` : '';
      el.innerHTML = `<div class="filters">${pick('loc', '📍', L('Ort', 'Location'), L('Alla orter', 'All locations'), locs, sel)}${pick('comp', '🏢', L('Företag', 'Company'), L('Alla företag', 'All companies'), comps, selC)}</div>`;
      const l = document.getElementById('loc'); if (l) l.onchange = (e) => { store.set('sammat_location', e.target.value); load(false); };
      const c = document.getElementById('comp'); if (c) c.onchange = (e) => { store.set('sammat_company', e.target.value); load(false); };
    }

    renderInstall(document.getElementById('install'));
    load(true);
    setInterval(() => load(false), 30000);
  </script>
</body>
</html>

<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>SamMat</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="SamMat" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <meta name="theme-color" content="#1e272e" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/common.js"></script>
</head>
<body>
  <div class="wrap narrow">
    <div class="topbar"><a href="/" class="logo">SamMat</a></div>
    <div id="app" class="card"><p class="muted">…</p></div>
  </div>
  <script>
    const appEl = document.getElementById('app');
    const token = location.pathname.split('/').pop();
    const wanted = new URLSearchParams(location.search).get('a'); // 'ja' | 'nej' from the mail button

    function render(o, msg) {
      const state = o.cancelled
        ? `<span class="st no">${L('Avbokad', 'Cancelled')}</span>`
        : o.confirmed ? `<span class="st yes">✓ ${L('Bekräftad', 'Confirmed')}</span>` : `<span class="st wait">${L('Inte besvarad', 'Not answered')}</span>`;
      appEl.innerHTML = `
        <h1>${esc(o.title)}</h1>
        <div class="info"><span>${esc(o.placeName)}</span><span>${L('För', 'For')} <strong>${esc(dayWord(o.eventDate))}</strong></span>
          ${o.foodEta ? `<span>${L('Mat ca', 'Food approx.')} <strong>${esc(o.foodEta)}</strong></span>` : ''}</div>
        <div class="box">
          <div><strong>#${o.orderNumber}</strong> ${esc(o.orderText)}</div>
          <div style="margin-top:8px">${esc(o.customerName)} · ${state}</div>
        </div>
        ${msg ? `<p style="margin-top:16px;font-size:1.05rem">${msg}</p>` : ''}
        ${o.canChange ? `
          <div class="row" style="margin-top:16px">
            <button class="go" data-a="yes" style="flex:1;padding:14px;font-size:1rem;${wanted === 'ja' && !o.confirmed ? 'box-shadow:0 0 0 3px var(--yellow)' : ''}" ${o.confirmed ? 'disabled' : ''}>✓ ${L('Jag vill ha maten', 'I want the food')}</button>
            <button class="danger" data-a="no" style="flex:1;padding:14px;font-size:1rem;${wanted === 'nej' && !o.cancelled ? 'box-shadow:0 0 0 3px var(--yellow)' : ''}" ${o.cancelled ? 'disabled' : ''}>✕ ${L('Avboka', 'Cancel')}</button>
          </div>
          <p style="margin-top:12px"><a href="${esc(o.editLink)}">${L('Ändra beställningen i stället', 'Change the order instead')} →</a></p>`
        : `<p class="muted" style="margin-top:16px">${L(`Beställningen är stängd – kontakta ${esc(o.creatorName)} om något ska ändras.`, `Ordering is closed – contact ${esc(o.creatorName)} if something needs to change.`)}</p>`}
        ${!o.cancelled ? '' : `<p class="muted" style="margin-top:14px">${L('Ångrat dig? Tryck på "Jag vill ha maten" så länge beställningen är öppen.', 'Changed your mind? Press "I want the food" while ordering is open.')}</p>`}
        ${o.cancelled && o.paid ? `<p class="muted">${L(`Du har redan swishat – ${esc(o.creatorName)} löser återbetalningen.`, `You have already paid – ${esc(o.creatorName)} will sort out the refund.`)}</p>` : ''}`;
      appEl.querySelectorAll('[data-a]').forEach((b) => {
        b.onclick = async () => {
          b.disabled = true;
          try {
            const res = await api('/api/answer/' + encodeURIComponent(token), 'POST', { answer: b.dataset.a });
            render(res, b.dataset.a === 'yes' ? L('Tack! Din beställning är bekräftad. 👍', 'Thanks! Your order is confirmed. 👍') : L('Din beställning är avbokad.', 'Your order is cancelled.'));
          } catch (e) {
            alert(e.message);
            b.disabled = false;
          }
        };
      });
    }

    api('/api/answer/' + encodeURIComponent(token))
      .then((o) => render(o, ''))
      .catch((e) => { appEl.innerHTML = `<h1>${L('Hittades inte', 'Not found')}</h1><p class="muted">${esc(e.message)}</p>`; });
  </script>
</body>
</html>
